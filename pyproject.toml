[project]
name = "holotrace"
version = "0.1.0"
description = "Computed holograms of ray-traced scenes"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "mitsuba>=3.9.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
holotrace = "holotrace:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x[ctk]>=14.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
