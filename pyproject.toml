[project]
name = "holotrace"
version = "0.1.0"
description = "Computed holograms of ray-traced scenes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mitsuba>=3.9.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[project.scripts]
holotrace = "holotrace:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
